services:
  backend:
    build: ./server
    container_name: cine_book_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env


  client:
    build: "./client"
    container_name: cine_book_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    env_file:
      - ./client/.env
  
  
